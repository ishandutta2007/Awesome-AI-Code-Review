<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="cyanRadial" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleRadial" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for crisp text shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7" />
    </filter>

    <style>
      @keyframes scanBeam {
        0% { transform: translateY(-30px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
      }
      @keyframes waveGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .scanner {
        animation: scanBeam 6s ease-in-out infinite;
      }
      .badge-float {
        animation: floatPulse 4s ease-in-out infinite;
      }
      .glow-line {
        animation: waveGlow 3.5s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 32px 32px;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Radial Atmosphere in Background -->
  <rect width="1200" height="360" rx="16" fill="url(#cyanRadial)" />
  <rect width="1200" height="360" rx="16" fill="url(#purpleRadial)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Scanner Laser (Confined to Background/Lower layer) -->
  <g class="scanner" opacity="0.6">
    <line x1="50" y1="0" x2="1150" y2="0" stroke="url(#scanGrad)" stroke-width="2.5" />
  </g>

  <!-- Ambient Dynamic Circuit / Wave Lines -->
  <g class="glow-line" opacity="0.5">
    <path d="M 0 300 Q 300 240 600 290 T 1200 270" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="6,6" />
    <path d="M 0 320 Q 350 360 700 310 T 1200 330" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Background Decorative Code Review Pill Cards (Non-interfering, positioned in corners) -->
  <!-- Top Right Card: PR Review Status -->
  <g class="badge-float" transform="translate(870, 35)">
    <rect width="280" height="64" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <!-- Mini PR Icon -->
    <circle cx="28" cy="32" r="14" fill="#10b981" fill-opacity="0.2" />
    <path d="M 24 32 L 27 35 L 33 28" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Pull Request #128</text>
    <text x="52" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">AI Review: 0 Defects • Approved</text>
  </g>

  <!-- Bottom Right Card: LLM Telemetry -->
  <g transform="translate(890, 245)">
    <rect width="260" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.9" />
    <text x="20" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">⚡ Static + LLM Analyzer</text>
    <text x="20" y="44" fill="#a855f7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="bold">Context: Multi-Repo AST</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Badges (Guaranteed High Contrast & Visible) -->
  <g filter="url(#shadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(80, 48)">
      <rect width="210" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <circle class="status-dot" cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="28" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome AI Code Review
    </text>

    <!-- Gradient Bar Underline -->
    <rect x="80" y="165" width="460" height="5" rx="2.5" fill="url(#primaryGlow)" />

    <!-- Subtitle -->
    <text x="80" y="215" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Intelligent Pull Request Analysis, Automated Review Comments &amp; Static Analysis
    </text>

    <!-- Tags Row in Foreground -->
    <g transform="translate(80, 255)">
      <!-- Tag 1 -->
      <rect width="135" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Agentic PRs</text>

      <!-- Tag 2 -->
      <rect x="147" width="135" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="161" y="21" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Code Quality</text>

      <!-- Tag 3 -->
      <rect x="294" width="150" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="308" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open &amp; SaaS</text>

      <!-- Tag 4 -->
      <rect x="456" width="165" height="32" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="470" y="21" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔍 AST &amp; SAST Gates</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7" />
</svg>
